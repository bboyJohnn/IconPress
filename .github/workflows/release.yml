name: Release

# Builds the stand-alone apps. Pushing a tag such as v1.1.0 (or running this workflow by hand
# with a version) also publishes them as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.1.0 (leave empty to only build)"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: python packaging/build.py
      - name: Smoke test
        if: runner.os == 'Linux'
        run: |
          QT_QPA_PLATFORM=offscreen timeout 10 dist/IconPress/IconPress || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v4
        with:
          name: IconPress-${{ runner.os }}
          path: |
            dist/IconPress-*.zip
            dist/IconPress-*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: IconPress ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
